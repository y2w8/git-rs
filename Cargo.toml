[package]
name = "git-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
anyhow = "1.0.104"
askama = "0.16.0"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.4", default-features = false, features = ["derive", "usage", "help", "std", "cargo", "env"] }
flate2 = "1.1.9"
gix = { version = "0.86.0", features = ["serde", "tracing", "parallel", "blob-diff", "revision"] }
linkify = "0.11.0"
md5 = "0.8.1"
mime_guess = "2.0.5"
notify = "8.2.0"
pulldown-cmark = "0.13.4"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
thiserror = "2.0.19"
time = "0.3.55"
timeago = "0.6.1"
tokio = "1.53.1"
v_htmlescape = { version = "0.15.8", default-features = false, features = ["bytes-buf"] }

[profile.dev.package.askama_derive]
opt-level = 3
